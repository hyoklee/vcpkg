name: fbsd

on:
  push:
    branches:
      - master

jobs:
  test:
    name: ${{ matrix.os.name }} ${{ matrix.os.architecture }} ${{ matrix.os.version }} on ${{ matrix.os.host }}
    runs-on: ${{ matrix.os.host }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: freebsd
            architecture: x86_64
            version: '15.0'
            host: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: hyoklee/vcpkg

      - name: Start ${{ matrix.os.name }} VM
        uses: cross-platform-actions/action@master
        with:
          operating_system: ${{ matrix.os.name }}
          architecture: ${{ matrix.os.architecture }}
          version: '${{ matrix.os.version }}'
          shell: bash

      - name: ${{ matrix.os.name }}
        shell: cpa.sh {0}
        run: |
            sudo pkg install -y cmake git gmake ninja pkgconf poco zip patchelf
            which clang
            which clang++
            export CC=clang
            export CXX=clang++
            ./bootstrap-vcpkg.sh
            VCPKG_FORCE_SYSTEM_BINARIES=1 ./vcpkg install wrp


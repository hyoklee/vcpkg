name: obsd

on:
  push:
    branches:
      - master

jobs:
  test:
    name: ${{ matrix.os.name }} ${{ matrix.os.architecture }} ${{ matrix.os.version }} on ${{ matrix.os.host }}
    runs-on: ${{ matrix.os.host }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: openbsd
            architecture: x86_64
            version: '7.8'
            host: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start ${{ matrix.os.name }} VM
        uses: cross-platform-actions/action@master
        with:
          operating_system: ${{ matrix.os.name }}
          architecture: ${{ matrix.os.architecture }}
          version: '${{ matrix.os.version }}'
          shell: bash

      - name: ${{ matrix.os.name }}
        shell: cpa.sh {0}
        run: |
            sudo pkg_add cmake curl git gmake ninja patchelf poco unzip-6.0p18 zip
            sudo ln -s /usr/local/lib/libcurl.so.26.34 /usr/local/lib/libcurl.so.4
            export PATH="/usr/local/bin:$PATH"
            which clang
            which clang++
            which unzip
            export CC=clang
            export CXX=clang++
            ./bootstrap-vcpkg.sh
            VCPKG_FORCE_SYSTEM_BINARIES=1 ./vcpkg install wrp[core]
